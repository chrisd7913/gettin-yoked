<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web --base-href`, e.g. /gettin-yoked/ on GitHub Pages. -->
  <base href="/gettin-yoked/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Log workouts, track progress. Works offline.">
  <meta name="theme-color" content="#201a18">

  <!-- Home-screen app on iPhone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gettin' Yoked">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gettin' Yoked</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #201a18; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #f2dfd8; font: 16px system-ui, -apple-system, sans-serif;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>Loading…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) l.remove();
    });

    // Offline support: sw.js keeps a copy of the app on the device.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function (reg) {
            // Also keep whatever the app fetched while starting up (the
            // rendering engine for this browser, fonts) for offline use.
            function keep() {
              if (!reg.active) return;
              reg.active.postMessage({
                cache: performance.getEntriesByType('resource').map(function (e) { return e.name; })
              });
            }
            setTimeout(keep, 8000);
            setTimeout(keep, 30000);
          })
          .catch(function (e) { console.warn('Offline support unavailable:', e); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
